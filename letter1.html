<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kỉ Niệm 1</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Georgia",serif;
  background:linear-gradient(135deg,#ffdde1,#ee9ca7);
  height:100vh;
  overflow:hidden;
}

/* ---------- SIDE DECORATIONS ---------- */
.side{
  position:fixed;
  top:0;
  bottom:0;
  width:180px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-around;
  pointer-events:none;
}
.left{left:0}
.right{right:0}

.side span{
  font-size:60px;
  animation:sway 6s ease-in-out infinite;
}
@keyframes sway{
  0%,100%{transform:rotate(-6deg)}
  50%{transform:rotate(6deg)}
}

/* ---------- CENTER LETTER ---------- */
#letterBox{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:60%;
  max-width:700px;
  background:rgba(255,255,255,0.9);
  border-radius:20px;
  padding:40px;
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
  text-align:center;
  animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translate(-50%,-45%)}
  to{opacity:1;transform:translate(-50%,-50%)}
}

h1{
  color:#c1121f;
  font-size:36px;
  margin-bottom:20px;
}

p{
  font-size:20px;
  line-height:1.8;
  color:#333;
}

/* ---------- FLOATING HEARTS ---------- */
.floating{
  position:absolute;
  bottom:-50px;
  font-size:24px;
  animation:floatUp 8s linear infinite;
  opacity:0.6;
}
@keyframes floatUp{
  to{transform:translateY(-120vh);opacity:0}
}
</style>
</head>

<body>

<!-- SIDE DECOR -->
<div class="side left">
  <span>❤️</span>
  <span>🤍</span>
  <span>❤️</span>
</div>

<div class="side right">
  <span>🤍</span>
  <span>❤️</span>
  <span>🤍</span>
</div>

<!-- LETTER CONTENT -->
<div id="letterBox">
  <h1>Kỉ Niệm 1 💌</h1>
  <p>
    Đây là nơi để viết bức thư của bạn.<br><br>
    Bạn có thể kể lại một kỉ niệm,
    một ngày đặc biệt,
    hoặc chỉ đơn giản là nói rằng
    bạn yêu người đó nhiều đến mức nào.
  </p>
</div>

<!-- FLOATING HEARTS -->
<span class="floating" style="left:20%;animation-delay:0s">❤️</span>
<span class="floating" style="left:50%;animation-delay:2s">🤍</span>
<span class="floating" style="left:80%;animation-delay:4s">❤️</span>

<!-- MUSIC -->
<audio autoplay loop>
  <source src="../letter-music.mp3" type="audio/mpeg">
</audio>

<script>
const audio=document.querySelector("audio");
audio.volume=0.25;
</script>

</body>
</html>
