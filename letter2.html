<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Love Letter ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== GLOBAL ===== */
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #ff5a7a, #8b0000);
  font-family: 'Poppins', sans-serif;
  color: white;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ===== LETTER ===== */
.letter {
  background: rgba(255, 255, 255, 0.12);
  border-radius: 20px;
  padding: 30px;
  max-width: 420px;
  text-align: center;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 40px rgba(255, 0, 70, 0.6);
  z-index: 2;
}

.letter h1 {
  margin-top: 0;
  color: #ffd6e0;
}

.letter p {
  line-height: 1.6;
  font-size: 16px;
}

/* ===== HEARTS ===== */
.heart {
  position: absolute;
  width: 18px;
  height: 18px;
  background: #ff2d55;
  transform: rotate(45deg);
  animation: floatUp linear infinite;
  opacity: 0.9;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  background: #ff2d55;
  border-radius: 50%;
}

.heart::before {
  top: -9px;
  left: 0;
}

.heart::after {
  left: -9px;
  top: 0;
}

@keyframes floatUp {
  from {
    transform: translateY(0) rotate(45deg);
    opacity: 1;
  }
  to {
    transform: translateY(-120vh) rotate(45deg);
    opacity: 0;
  }
}

/* ===== FIREWORK ===== */
.spark {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ff4d6d;
  box-shadow: 0 0 35px 18px rgba(255, 77, 109, 0.9);
  pointer-events: none;
}
</style>
</head>

<body>

<div class="letter">
  <h1>❤️ My Love ❤️</h1>
  <p>
    Every time I think about you,<br>
    my heart feels warm and safe.<br><br>
    You are not just someone I love,<br>
    you are the reason my days feel brighter<br>
    and my nights feel softer.<br><br>
    No matter where life takes us,<br>
    my heart will always find its way back to you.
  </p>
  <p style="margin-top:20px;">Forever yours 💕</p>
</div>

<script>
/* ===== HEART GENERATOR ===== */
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.bottom = "-20px";
  heart.style.animationDuration = 4 + Math.random() * 4 + "s";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);
}
setInterval(createHeart, 280);

/* ===== FIREWORK SOUNDS ===== */
/* Put these files in a /sounds folder */
const fireworkSounds = [
  new Audio("sounds/firework1.mp3"),
  new Audio("sounds/firework2.mp3"),
  new Audio("sounds/firework3.mp3")
];

function playFireworkSounds() {
  fireworkSounds.forEach(sound => {
    const s = sound.cloneNode();
    s.volume = 0.5 + Math.random() * 0.4;
    s.play();
  });
}

/* ===== EXPLOSION ===== */
function explode(x, y) {
  playFireworkSounds();

  for (let i = 0; i < 22; i++) {
    const spark = document.createElement("div");
    spark.className = "spark";
    spark.style.left = x + "px";
    spark.style.top = y + "px";
    document.body.appendChild(spark);

    const angle = Math.random() * Math.PI * 2;
    const distance = 90 + Math.random() * 90;

    spark.animate([
      { transform: "translate(0,0)", opacity: 1 },
      {
        transform: `translate(${Math.cos(angle)*distance}px, ${Math.sin(angle)*distance}px)`,
        opacity: 0
      }
    ], {
      duration: 1000,
      easing: "ease-out"
    });

    setTimeout(() => spark.remove(), 1000);
  }
}

/* Click anywhere */
document.addEventListener("click", e => {
  explode(e.clientX, e.clientY);
});
</script>

</body>
</html>
