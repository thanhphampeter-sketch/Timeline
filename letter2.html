<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tết & 5 Tháng 💗</title>

  <!-- Fonts (Vietnamese safe) -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: radial-gradient(circle at top, #ffd6e5, #ff9bbd);
      overflow: hidden;
      height: 100vh;
    }

    /* ===== MUSIC ===== */
    audio {
      display: none;
    }

    /* ===== FIREWORK CANVAS ===== */
    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== TITLE BUTTON ===== */
    .title-screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: opacity 1s ease, transform 1s ease;
    }

    .title-btn {
      font-family: 'Playfair Display', serif;
      font-size: 34px;
      padding: 24px 48px;
      border-radius: 60px;
      background: linear-gradient(135deg, #ff4d6d, #ff8fab);
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 20px 40px rgba(0,0,0,.25);
      transition: transform .4s ease, box-shadow .4s ease;
    }

    .title-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 25px 60px rgba(0,0,0,.35);
    }

    /* ===== LETTER ===== */
    .letter-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(40px);
      transition: opacity 1.2s ease, transform 1.2s ease;
      z-index: 1;
    }

    .letter {
      background: #fff5f8;
      max-width: 720px;
      padding: 50px;
      border-radius: 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,.25);
      text-align: center;
    }

    .letter h1 {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      color: #c1121f;
      margin-bottom: 18px;
    }

    .letter p {
      font-size: 20px;
      line-height: 1.9;
      color: #3a3a3a;
      margin-top: 16px;
    }

    /* ===== ACTIVE STATES ===== */
    .hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(.9);
    }

    .show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
  </style>
</head>

<body>

<!-- 🎵 Background music -->
<audio id="bgMusic" src="letter2-music.mp3" loop></audio>

<!-- 🎆 Firework sound -->
<audio id="boom" src="firework.mp3"></audio>

<canvas id="fireworks"></canvas>

<!-- TITLE -->
<div class="title-screen" id="titleScreen">
  <button class="title-btn" onclick="startLetter()">
    🌸 Chúc Mừng Năm Mới & 5 Tháng Yêu Nhau 🌸
  </button>
</div>

<!-- LETTER -->
<div class="letter-wrapper" id="letter">
  <div class="letter">
    <h1>Tết này có chúng ta 💗</h1>
    <p>
      5 tháng bên nhau, rồi thêm một cái Tết nữa có em.<br>
      Cảm ơn em vì đã ở lại, vì đã chọn anh,  
      và vì đã làm những ngày bình thường trở nên đặc biệt.
    </p>
    <p>
      Mong rằng không chỉ Tết này,  
      mà rất nhiều mùa xuân sau nữa…  
      mình vẫn cùng nhau như vậy.
    </p>
    <p>Yêu em rất nhiều 💖</p>
  </div>
</div>

<script>
  const title = document.getElementById('titleScreen');
  const letter = document.getElementById('letter');
  const music = document.getElementById('bgMusic');
  const boom = document.getElementById('boom');

  function startLetter() {
    title.classList.add('hidden');
    letter.classList.add('show');
    music.volume = 0.35;
    music.play();

    // Play firework sound only 2 times
    setTimeout(() => boom.play(), 800);
    setTimeout(() => boom.play(), 2200);
  }

  /* ===== FIREWORKS ===== */
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth;
  canvas.height = innerHeight;

  const fireworks = [];

  function randomFirework() {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height * 0.6;
    const particles = [];
    const colors = ['#ff4d6d', '#ff8fab', '#ffd166', '#fff'];

    for (let i = 0; i < 90; i++) {
      particles.push({
        x, y,
        angle: Math.random() * Math.PI * 2,
        speed: Math.random() * 4 + 2,
        radius: 2,
        alpha: 1,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    fireworks.push(particles);
  }

  function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    fireworks.forEach((fw, i) => {
      fw.forEach(p => {
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        p.alpha -= 0.015;

        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      if (fw[0].alpha <= 0) fireworks.splice(i,1);
    });

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }

  setInterval(randomFirework, 900);
  animate();

  window.onresize = () => {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
  };
</script>

</body>
</html>
